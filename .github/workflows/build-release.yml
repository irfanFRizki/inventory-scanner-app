name: Build & Release APK

# Jalan saat push tag versi (v1.0.0, dst) atau dipicu manual dari tab Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  KS_PASS: scannergudang
  KS_ALIAS: scanner-gudang

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build the exact pushed tag (or selected branch for manual runs).
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Build pertama: keystore dibuat di sini lalu di-commit ke repo,
      # supaya build berikutnya memakai tanda tangan yang sama persis
      # (penting agar update APK bisa menimpa versi lama tanpa uninstall).
      - name: Siapkan keystore signing
        run: |
          if [ ! -f ci/release.keystore ]; then
            echo "Keystore belum ada, membuat baru..."
            mkdir -p ci
            keytool -genkeypair -v \
              -keystore ci/release.keystore \
              -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Scanner Gudang, OU=Gudang, O=irfanFRizki, L=Jakarta, C=ID"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f ci/release.keystore
            git commit -m "CI: buat keystore signing otomatis (sekali saja)"
            git push origin HEAD:main
          else
            echo "Keystore sudah ada, dipakai ulang."
          fi

      # Bukan "npm ci" — project ini belum punya package-lock.json.
      - name: Install dependencies
        run: npm install

      - name: Tentukan versi & suntikkan ke app.js
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "IS_RELEASE=true" >> $GITHUB_ENV
          else
            VERSION="0.0.0-dev"
            echo "IS_RELEASE=false" >> $GITHUB_ENV
          fi
          echo "Versi: $VERSION"
          sed -i "s/var APP_VERSION = '.*';/var APP_VERSION = '${VERSION}';/" www/app.js
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      # Folder android/ tidak di-commit, jadi dibuat ulang di setiap build.
      - name: Buat proyek Android & sync plugin
        run: |
          npx cap add android
          npx cap sync android

      # `npx cap add android` SELALU menulis versionName "1.0" / versionCode 1
      # di android/app/build.gradle, apa pun tag git-nya — langkah "Tentukan versi"
      # di atas cuma menyuntik www/app.js, tidak pernah menyentuh file ini. Karena
      # init() di app.js mengganti APP_VERSION dengan App.getInfo().version (versi
      # native, bukan variabel JS), yang tampil di UI selalu "1.0" biarpun tag-nya
      # sudah v2.1.x. Ini yang membuat versi di aplikasi tidak pernah berubah.
      - name: Set versionName & versionCode Android sesuai tag
        run: |
          sed -i "s/versionName \"1.0\"/versionName \"${APP_VERSION}\"/" android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Patch AndroidManifest.xml untuk redirect OAuth Google
        run: node scripts/patch-android-manifest.js

      # Unduhan Gradle dari services.gradle.org / github.com sering timeout atau 504
      # di runner GitHub. Cache menyimpan distribusi Gradle untuk build berikutnya.
      # Dipisah restore/save supaya cache tetap tersimpan walau build gagal di tengah.
      - name: Restore cache Gradle wrapper
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-dists-v1
          restore-keys: |
            gradle-wrapper-dists-

      # Ulangi build sampai 4 kali kalau gagal karena unduhan (timeout/504).
      # Error kompilasi yang sungguhan tetap gagal setelah percobaan terakhir.
      - name: Pre-download Gradle wrapper (hanya jika cache miss)
        run: |
          MD5_DIST=~/.gradle/wrapper/dists/gradle-8.2.1-all-d8pvvlun5bx6sdtwqhf8y9z4b
          SHA_DIST=~/.gradle/wrapper/dists/gradle-8.2.1-all-4123ee49
          ZIP="$MD5_DIST/gradle-8.2.1-all.zip"
          mkdir -p "$MD5_DIST"
          if [ -s "$ZIP" ]; then
            echo "Gradle wrapper sudah ada di cache, dilewati."
          else
            echo "Cache miss — mengunduh Gradle 8.2.1 ke cache wrapper..."
            for i in 1 2 3 4 5; do
              echo "Percobaan unduh $i/5"
              if curl -fL --retry 0 --connect-timeout 15 --max-time 1200 \
                -o "$ZIP" \
                "https://services.gradle.org/distributions/gradle-8.2.1-all.zip"; then
                echo "Unduhan sukses ($(du -h "$ZIP" | cut -f1))"
                break
              fi
              echo "Gagal. Tunggu 15 detik..."
              sleep 15
            done
          fi
          if [ ! -s "$ZIP" ]; then
            echo "Gagal mengunduh Gradle wrapper setelah 5 percobaan."
            exit 1
          fi
          # Tandai distribusi sudah terinstal agar ./gradlew tidak unduh lagi.
          touch "$MD5_DIST/gradle-8.2.1-all.zip.ok"
          # Beberapa versi Gradle menamai direktori cache dengan hash lain;
          # buat symlink supaya kedua kemungkinan nama direktori terpenuhi.
          [ -d "$SHA_DIST" ] || ln -s "$MD5_DIST" "$SHA_DIST"
          ls -la "$MD5_DIST"

      - name: Simpan cache Gradle wrapper (agar tersedia di build berikutnya)
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-dists-v1

      - name: Setel timeout Gradle (hindari gagal jaringan 504/timeout)
        run: |
          cat >> android/gradle.properties <<'EOF'
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          EOF
          cat android/gradle.properties

      - name: Build Release APK (signed)
        working-directory: android
        run: |
          chmod +x ./gradlew
          for attempt in 1 2 3 4; do
            echo "=== Build percobaan ${attempt}/4 ==="
            if ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=${GITHUB_WORKSPACE}/ci/release.keystore \
              -Pandroid.injected.signing.store.password="${KS_PASS}" \
              -Pandroid.injected.signing.key.alias="${KS_ALIAS}" \
              -Pandroid.injected.signing.key.password="${KS_PASS}"; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              wait=$((attempt * 30))
              echo "Gagal. Mencoba lagi dalam ${wait} detik..."
              sleep "$wait"
            fi
          done
          echo "Build gagal setelah 4 percobaan."
          exit 1

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/scanner-gudang-v${APP_VERSION}.apk"

      - name: Upload artifact (untuk build manual)
        uses: actions/upload-artifact@v4
        with:
          name: scanner-gudang-apk
          path: out/*.apk

      - name: Create GitHub Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          name: "Scanner Gudang v${{ env.APP_VERSION }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
