name: Deploy web version to GitHub Pages

# Menayangkan folder www/ sebagai situs statis (versi web Scanner Gudang).
# Aktifkan sekali: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'scripts/stage-pages.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      - name: Stage www & suntik WEB_SHEETS_API_KEY ke salinan staging
        env:
          WEB_SHEETS_API_KEY: ${{ secrets.WEB_SHEETS_API_KEY }}
          PAGES_STAGING_DIR: ${{ runner.temp }}/pages-www
        run: node scripts/stage-pages.js "$PAGES_STAGING_DIR"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/pages-www
      - name: Wait for artifact metadata to be available
        run: sleep 10
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
