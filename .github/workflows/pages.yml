name: Deploy web version to GitHub Pages

# Menayangkan folder www/ sebagai situs statis (versi web Scanner Gudang).
# Aktifkan sekali: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'scripts/stage-pages.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Stage www & suntik WEB_SHEETS_API_KEY ke salinan staging
        env:
          WEB_SHEETS_API_KEY: ${{ secrets.WEB_SHEETS_API_KEY }}
          PAGES_STAGING_DIR: ${{ runner.temp }}/pages-www
        run: node scripts/stage-pages.js "$PAGES_STAGING_DIR"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-www
      - id: deployment
        uses: actions/deploy-pages@v4
