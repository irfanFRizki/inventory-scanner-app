name: Lint & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate workflow YAML
        run: ruby -ryaml -e "Dir['.github/workflows/*.yml'].each { |f| YAML.load_file(f) }"

      - name: Run secret isolation & syntax checks
        run: npm test

      - name: Verify Capacitor Android APK source has no web API key
        run: |
          npm install
          npx cap add android
          npx cap sync android
          node scripts/patch-android-manifest.js
          node scripts/test-secrets-isolation.js --apk-dir android/app/src/main/assets/public
